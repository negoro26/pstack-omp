name: upstream-sync

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      sha:
        description: Upstream cursor/plugins sha to sync to, defaults to the newest commit that touched pstack/
        required: false

concurrency:
  group: upstream-sync
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

# bash gives every step pipefail. The default `bash -e` lets a failed command before `| tail` pass.
defaults:
  run:
    shell: bash

jobs:
  sync:
    runs-on: ubuntu-latest
    outputs:
      pr: ${{ steps.build.outputs.pr }}
      sha: ${{ steps.build.outputs.sha }}
      branch: ${{ steps.build.outputs.branch }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: plan
        env:
          SHA_INPUT: ${{ inputs.sha }}
        run: |
          export SYNC_TARGET_OUT="$RUNNER_TEMP/target.txt"
          bash omp-port/sync-upstream.sh check > "$RUNNER_TEMP/commits.txt"
          target=${SHA_INPUT:-$(cat "$RUNNER_TEMP/target.txt")}
          [[ $target =~ ^[0-9a-f]{40}$ ]] || {
            echo "target must be a full 40-hex sha, got '$target'" >&2
            exit 1
          }
          short=${target:0:7}
          if [ "$target" = "$(tr -d '[:space:]' < omp-port/UPSTREAM)" ]; then
            echo "already at the pin $short, nothing to sync"
            exit 0
          fi
          # commits.txt is newest first, so the target's row and every row under it are what the build brings in.
          awk -F'\t' -v short="$short" '$1 == short { found = 1 } found' "$RUNNER_TEMP/commits.txt" > "$RUNNER_TEMP/planned.txt"
          if [ ! -s "$RUNNER_TEMP/planned.txt" ]; then
            echo "target $short is not among the upstream pstack commits after the pin, and a sync never moves the pin back" >&2
            exit 1
          fi
          mv "$RUNNER_TEMP/planned.txt" "$RUNNER_TEMP/commits.txt"
          open=$(gh pr list --state open --json headRefName --jq '[.[] | select(.headRefName | startswith("sync/upstream-"))] | length')
          if [ "$open" -gt 0 ]; then
            gh pr list --state open --json number,headRefName \
              --jq '.[] | select(.headRefName | startswith("sync/upstream-")) | "open sync PR #\(.number) on \(.headRefName), resolve it first"'
            exit 0
          fi
          branch="sync/upstream-$short"
          refs=$(git ls-remote origin "refs/heads/$branch")
          if [ -n "$refs" ]; then
            prior=$(gh pr list --head "$branch" --state all --json number,state --jq '.[] | "#\(.number) (\(.state | ascii_downcase))"')
            if [ -n "$prior" ]; then
              echo "$branch already carried PR $prior, delete the branch to sync $short again"
              exit 0
            fi
            # A branch that never got a PR is a run whose `gh pr create` failed after the push.
            echo "$branch is on origin without a PR, rebuilding it"
          fi
          printf 'target=%s\nshort=%s\ngo=yes\n' "$target" "$short" >> "$GITHUB_OUTPUT"

      # A red trunk means the build no longer reproduces the pinned tree. Syncing on top of that
      # merges over the breakage instead of fixing it.
      - if: steps.plan.outputs.go == 'yes'
        run: bash omp-port/check-port.sh

      # The commit list says upstream moved. This asks whether the port survives the move, before
      # anything is rewritten. Without it the first signal that a rules.sed rule has been outrun is
      # a Cursor API sitting in a generated skill, which is after the pin moved and the tree was
      # rebuilt and therefore after the evidence is mixed into the port's own history.
      - if: steps.plan.outputs.go == 'yes'
        env:
          TARGET: ${{ steps.plan.outputs.target }}
        run: bash omp-port/check-port.sh "" "$TARGET"

      - id: build
        if: steps.plan.outputs.go == 'yes'
        env:
          TARGET: ${{ steps.plan.outputs.target }}
          SHORT: ${{ steps.plan.outputs.short }}
        run: |
          AT=$(printf '\100')
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]${AT}users.noreply.github.com"
          git switch -c "sync/upstream-$SHORT"
          code=0
          bash omp-port/sync-upstream.sh "$TARGET" > "$RUNNER_TEMP/sync.log" 2>&1 || code=$?
          gate=0
          if [ "$code" -eq 0 ]; then
            bash omp-port/check-port.sh > "$RUNNER_TEMP/gate.txt" 2>&1 || gate=$?
          else
            gate=1
            echo "gate not run, the sync exited $code" > "$RUNNER_TEMP/gate.txt"
          fi
          version=$(jq -r .version plugins/pstack/package.json)
          git add -A
          if git diff --cached --quiet; then
            echo "sync exited $code and changed nothing, no PR to open"
            cat "$RUNNER_TEMP/sync.log"
            exit 1
          fi
          git commit -q -m "sync: build upstream pstack $SHORT ($version)"
          git push -q --force origin HEAD
          {
            printf 'Upstream commits since the previous pin.\n\n```\n'; cat "$RUNNER_TEMP/commits.txt"
            printf '```\n\nSync output, exit %s.\n\n```\n' "$code"; cat "$RUNNER_TEMP/sync.log"
            printf '```\n\nGate output, exit %s.\n\n```\n' "$gate"; cat "$RUNNER_TEMP/gate.txt"
            printf '```\n'
          } > "$RUNNER_TEMP/body.md"
          pr=$(gh pr create --base main --head "sync/upstream-$SHORT" \
            --title "sync: upstream pstack $SHORT ($version)" --body-file "$RUNNER_TEMP/body.md" | tail -n1)
          [[ $pr == https://* ]] || {
            echo "gh pr create printed no PR URL, got '$pr'" >&2
            exit 1
          }
          if [ "$code" -eq 0 ] && [ "$gate" -eq 0 ]; then
            printf 'pr=%s\nsha=%s\nbranch=%s\n' "$pr" "$(git rev-parse HEAD)" "sync/upstream-$SHORT" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "left $pr open for a human: sync exit $code, gate exit $gate"
          exit 1

  # A merge made with github.token starts no push run on main, so this job is the only full gate a
  # sync gets. It dispatches gate.yml on the sync branch rather than calling it: the dispatched run
  # puts `gate`, `smoke`, and `statechart` on the sync commit, which the main ruleset requires before
  # any merge. A red gate fails this job, skips the merge, and leaves the PR open for a human.
  gate:
    needs: sync
    if: needs.sync.outputs.sha != ''
    runs-on: ubuntu-latest
    permissions:
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      SHA: ${{ needs.sync.outputs.sha }}
      BRANCH: ${{ needs.sync.outputs.branch }}
    steps:
      - run: |
          gh workflow run gate.yml --repo "$GITHUB_REPOSITORY" --ref "$BRANCH"
          id=""
          for _ in $(seq 1 30); do
            id=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow gate.yml --event workflow_dispatch \
              --branch "$BRANCH" --json databaseId,headSha \
              --jq "[.[] | select(.headSha == \"$SHA\")][0].databaseId // empty")
            [ -n "$id" ] && break
            sleep 10
          done
          [ -n "$id" ] || { echo "no gate run appeared for $SHA on $BRANCH" >&2; exit 1; }
          gh run watch "$id" --repo "$GITHUB_REPOSITORY" --exit-status --interval 30

  merge:
    needs: [sync, gate]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      PR: ${{ needs.sync.outputs.pr }}
      SHA: ${{ needs.sync.outputs.sha }}
    steps:
      - run: gh pr merge "$PR" --repo "$GITHUB_REPOSITORY" --squash --delete-branch --match-head-commit "$SHA"
