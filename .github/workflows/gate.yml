name: gate

on:
  pull_request:
    # `edited` is load-bearing for a stacked port: merging by retargeting each PR's base to main
    # fires that activity type, and with the default set the one change that invalidates a gate run
    # is the change that leaves the gate unrun, so the pre-retarget green reads as evidence for the
    # post-retarget state. Folded in from the CI-guards change so both land in one file hunk.
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Shell syntax
        # One bash -n per file, in a loop. `bash -n a.sh b.sh` parses a.sh and passes b.sh through as
        # a positional parameter, so the single-command form checks exactly one file and reports
        # success for the rest, which is worse than no step: it looks like four scripts are covered.
        run: |
          for f in omp-port/*.sh; do
            echo "::group::$f"
            bash -n "$f"
            echo "::endgroup::"
          done
      - name: Port gate
        run: bash omp-port/check-port.sh
      - name: Install script test dependencies
        working-directory: plugins/pstack/skills/poteto-mode/scripts
        run: bun install --frozen-lockfile
      - name: Script tests
        working-directory: plugins/pstack/skills/poteto-mode/scripts
        run: bun run test
      - name: Setup script tests
        run: bun test plugins/pstack/skills/setup-pstack/scripts
      - name: Script typecheck
        working-directory: plugins/pstack/skills/poteto-mode/scripts
        run: bun run typecheck
      - name: Extension tests
        working-directory: plugins/pstack
        run: bun test ./extensions/potetomode/index.test.js ./extensions/pstackpolicy/index.test.js

  smoke:
    # A real omp loads plugins/pstack: every skill directory must register as a command, and the
    # pin extension must record and reload its state. omp-port/smoke-plugin.mjs names each check.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Install pinned omp
        # can1357/oh-my-pi release v18.12.6, asset omp-linux-x64, sha256
        # 85d9daf3a05fc76e8cd425ae1904eb576af8d21cc85fcf4690742626e07ccfa4. That is the digest
        # `gh api repos/can1357/oh-my-pi/releases/latest` reports for the asset and the sha256 of the
        # downloaded file, checked 2026-10-22. A bump changes the tag and the digest together.
        env:
          OMP_TAG: v18.12.6
          OMP_SHA256: 85d9daf3a05fc76e8cd425ae1904eb576af8d21cc85fcf4690742626e07ccfa4
        run: |
          dir="$RUNNER_TEMP/omp"
          mkdir -p "$dir"
          curl -fsSL --retry 3 -o "$dir/omp" \
            "https://github.com/can1357/oh-my-pi/releases/download/$OMP_TAG/omp-linux-x64"
          echo "$OMP_SHA256  $dir/omp" | sha256sum --check -
          chmod +x "$dir/omp"
          echo "$dir" >> "$GITHUB_PATH"
      - name: Plugin smoke
        run: OMP_SMOKE_REQUIRED=1 bun omp-port/smoke-plugin.mjs
