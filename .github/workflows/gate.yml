name: gate

on:
  pull_request:
    # `edited` is load-bearing for a stacked port: merging by retargeting each PR's base to main
    # fires that activity type, and with the default set the one change that invalidates a gate run
    # is the change that leaves the gate unrun, so the pre-retarget green reads as evidence for the
    # post-retarget state. Folded in from the CI-guards change so both land in one file hunk.
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]
  workflow_call:
    inputs:
      ref:
        description: Commit to gate. upstream-sync passes its sync commit and merges only after this run passes.
        type: string
        required: true

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Shell syntax
        # One bash -n per file, in a loop. `bash -n a.sh b.sh` parses a.sh and passes b.sh through as
        # a positional parameter, so the single-command form checks exactly one file and reports
        # success for the rest, which is worse than no step: it looks like every script is covered.
        run: |
          for f in $(git ls-files '*.sh'); do
            echo "::group::$f"
            bash -n "$f"
            echo "::endgroup::"
          done
      - name: Port gate
        run: bash omp-port/check-port.sh
      - name: Install script test dependencies
        working-directory: plugins/pstack/skills/poteto-mode/scripts
        run: bun install --frozen-lockfile
      - name: Script tests
        working-directory: plugins/pstack/skills/poteto-mode/scripts
        run: bun run test
      - name: Script typecheck
        working-directory: plugins/pstack/skills/poteto-mode/scripts
        run: bun run typecheck
      - name: Extension tests
        working-directory: plugins/pstack
        run: bun test ./extensions

  smoke:
    # A real omp loads plugins/pstack through -e, `omp plugin link`, and a local marketplace install,
    # and runs scripted turns: every skill registers, the pinned prompt names poteto-mode, and
    # pstackpolicy refuses a merge before gh runs. omp-port/smoke-plugin.mjs names each check.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Install pinned omp
        # can1357/oh-my-pi release v18.14.1, asset omp-linux-x64, sha256
        # 02d76a0cfeee473ffa387f50cf0378b0de1c44684c83e67ca27ba4d717cfb0d0. That is the digest
        # `gh release view v18.14.1 -R can1357/oh-my-pi --json assets` reports for the asset and the
        # sha256 of the downloaded file, checked 2026-10-31. A bump changes the tag and the digest together.
        env:
          OMP_TAG: v18.14.1
          OMP_SHA256: 02d76a0cfeee473ffa387f50cf0378b0de1c44684c83e67ca27ba4d717cfb0d0
        run: |
          dir="$RUNNER_TEMP/omp"
          mkdir -p "$dir"
          curl -fsSL --retry 3 -o "$dir/omp" \
            "https://github.com/can1357/oh-my-pi/releases/download/$OMP_TAG/omp-linux-x64"
          echo "$OMP_SHA256  $dir/omp" | sha256sum --check -
          chmod +x "$dir/omp"
          echo "$dir" >> "$GITHUB_PATH"
      - name: Plugin smoke
        run: OMP_SMOKE_REQUIRED=1 bun omp-port/smoke-plugin.mjs
      - name: Worktree audit against live omp
        run: OMP_AUDIT_LIVE_REQUIRED=1 bash omp-port/test-worktree-audit.sh

  statechart:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: plugins/pstack/skills/statechart/scripts
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install test dependencies
        run: npm install --no-package-lock
      - name: Statechart tests
        # The cases that need TLC skip, because the runner sets no TLA2TOOLS.
        run: npm test
